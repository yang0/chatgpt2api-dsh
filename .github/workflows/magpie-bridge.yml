name: Magpie DSH provider bridge

on:
  push:
    paths:
      - 'integrations/magpie/**'
      - '.github/workflows/magpie-bridge.yml'
  pull_request:
    paths:
      - 'integrations/magpie/**'
      - '.github/workflows/magpie-bridge.yml'

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests - local provider bridge
        working-directory: integrations/magpie
        run: npm test
